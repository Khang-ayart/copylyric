<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lyric & LRC Tool</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f1117;color:#e6e6e6;padding:16px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:4px}
.sub{color:#8b93a7;font-size:.9rem;margin-bottom:20px}
.bar{display:flex;gap:8px;margin-bottom:16px}
input,textarea{width:100%;padding:12px;font-size:16px;background:#1a1d27;border:1px solid #2c3140;border-radius:10px;color:#e6e6e6;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:#5b7cfa}
textarea{min-height:220px;resize:vertical;line-height:1.7}
button{padding:12px 18px;font-size:15px;font-weight:600;background:#5b7cfa;color:#fff;border:0;border-radius:10px;cursor:pointer;white-space:nowrap}
button:disabled{background:#3a3f52;cursor:not-allowed}
button.ghost{background:#242836;color:#c8cede}
button.sm{padding:7px 12px;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:6px 12px;background:#1a1d27;border:1px solid #2c3140;border-radius:99px;font-size:13px;cursor:pointer;color:#a8b0c4}
.card{background:#171a24;border:1px solid #262b38;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.card:active{background:#1e2230}
.card b{display:block;font-size:1rem}
.card span{color:#8b93a7;font-size:.85rem}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle}
.lrc{background:#1e7a4a;color:#c9f5dd}
.txt{background:#4a4f63;color:#d5d9e6}
.inst{background:#7a5a1e;color:#f5e3c9}
.panel{background:#171a24;border:1px solid #262b38;border-radius:12px;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.lyrics{background:#12141c;border-radius:10px;padding:14px;max-height:52vh;overflow-y:auto;white-space:pre-wrap;font-size:16px}
.stanza{padding:8px;border-radius:8px;margin-bottom:12px;cursor:pointer}
.stanza:active{background:#232838}
.ts{color:#5b7cfa;font-family:ui-monospace,monospace;font-size:.85em;margin-right:8px}
.muted{color:#8b93a7;font-size:.85rem}
.err{color:#ff8b8b;padding:12px 0}
a{color:#7d9bff}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎵 Lyric & LRC Tool</h1>
  <p class="sub">Tìm lời · Copy 1 chạm · Tải .lrc / .srt cho video &amp; karaoke</p>

  <div class="bar">
    <input id="q" placeholder="Tên bài hoặc ca sĩ…" autocomplete="off">
    <button id="btn">Tìm</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="out"><p class="muted">Đang tải gợi ý…</p></div>
</div>

<script>
const API = 'https://lrclib.net/api';
const out = document.getElementById('out');
const qEl = document.getElementById('q');
const btn = document.getElementById('btn');
let cur = null, showTS = false;

/* ---------- utils ---------- */
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => s ? `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}` : '';

function parseLRC(lrc){
  const rows = [];
  for (const raw of (lrc||'').split('\n')){
    const m = raw.match(/^((?:\[\d+:\d+(?:\.\d+)?\])+)(.*)$/);
    if(!m) continue;
    const text = m[2].trim();
    for (const t of m[1].match(/\[(\d+):(\d+(?:\.\d+)?)\]/g)){
      const p = t.slice(1,-1).split(':');
      rows.push({ time: +p[0]*60 + parseFloat(p[1]), text });
    }
  }
  return rows.sort((a,b)=>a.time-b.time);
}
const fmtLRC = t => `[${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(2).padStart(5,'0')}]`;

function toSRT(rows){
  const srtT = t => `${String(Math.floor(t/3600)).padStart(2,'0')}:${String(Math.floor(t/60)%60).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')},${String(Math.round(t%1*1000)).padStart(3,'0')}`;
  return rows.map((r,i)=>{
    const end = rows[i+1] ? Math.max(r.time+0.5, rows[i+1].time-0.08) : r.time+4;
    return `${i+1}\n${srtT(r.time)} --> ${srtT(end)}\n${r.text||'♪'}\n`;
  }).join('\n');
}

async function copyText(text, el){
  try{ await navigator.clipboard.writeText(text); }
  catch{ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  if(el){ const o=el.textContent; el.textContent='✓ Đã copy'; setTimeout(()=>el.textContent=o,1400); }
}

function downloadFile(name, text){
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ---------- search ---------- */
btn.addEventListener('click', doSearch);
qEl.addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

async function doSearch(q){
  const query = (q ?? qEl.value).trim();
  if(!query) return;
  qEl.value = query;
  btn.disabled = true;
  out.innerHTML = '<p class="muted">🔍 Đang tìm…</p>';
  try{
    const r = await fetch(`${API}/search?q=${encodeURIComponent(query)}`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const list = await r.json();
    if(!list.length){
      out.innerHTML = `<p class="err">Không tìm thấy "${esc(query)}" trong LRCLIB.</p>
        <div class="panel">
          <p class="muted" style="margin-bottom:10px">Bạn có lời sẵn? Dán vào để copy / tải .txt, hoặc tìm nguồn rồi đóng góp lại.</p>
          <div class="row">
            <button id="btn-paste">📝 Dán lời thủ công</button>
            <button class="ghost" id="btn-google">🔍 Tìm trên Google</button>
          </div>
        </div>`;
      document.getElementById('btn-paste').addEventListener('click', pasteBox);
      document.getElementById('btn-google').addEventListener('click', ()=>window.open('https://www.google.com/search?q='+encodeURIComponent(query+' lyrics'),'_blank'));
      return;
    }
    out.innerHTML = `<p class="muted" style="margin-bottom:10px">${list.length} kết quả · bấm để mở</p><div id="list"></div>`;
    const listEl = document.getElementById('list');
    list.slice(0,40).forEach(t=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<b>${esc(t.trackName)}${t.syncedLyrics?'<span class="badge lrc">LRC</span>':t.instrumental?'<span class="badge inst">INST</span>':'<span class="badge txt">TEXT</span>'}</b><span>${esc(t.artistName)}${t.albumName?' · '+esc(t.albumName):''}${t.duration?' · '+mmss(t.duration):''}</span>`;
      card.addEventListener('click', ()=>openTrack(t.id));
      listEl.appendChild(card);
    });
  }catch(e){
    out.innerHTML = `<p class="err">Lỗi kết nối LRCLIB (${esc(e.message)}). Thử lại sau ít phút.</p>`;
  }finally{ btn.disabled = false; }
}

/* ---------- detail ---------- */
async function openTrack(id){
  out.innerHTML = '<p class="muted">Đang tải…</p>';
  try{
    const r = await fetch(`${API}/get/${id}`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    cur = await r.json();
    showTS = !!cur.syncedLyrics;
    render();
  }catch(e){
    out.innerHTML = `<p class="err">Không tải được bài này (${esc(e.message)}).</p>`;
  }
}

function render(){
  const plain = cur.plainLyrics || '';
  const synced = cur.syncedLyrics || '';
  const text = showTS && synced ? synced : plain;
  const slug = `${cur.artistName} - ${cur.trackName}`.replace(/[\\/:*?"<>|]/g,'_');

  let body;
  if(!text){
    body = `<p class="muted">${cur.instrumental?'🎼 Bài này là nhạc không lời (instrumental).':'⚠️ Chưa có lời cho bài này.'}</p>`;
  } else if(showTS && synced){
    body = `<div class="lyrics" id="lyrics-box"></div>`;
  } else {
    body = `<div class="lyrics" id="lyrics-box"></div>`;
  }

  out.innerHTML = `
    <button class="ghost sm" id="btn-back" style="margin-bottom:12px">← Kết quả</button>
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div><b style="font-size:1.15rem">${esc(cur.trackName)}</b><br><span class="muted">${esc(cur.artistName)}${cur.duration?' · '+mmss(cur.duration):''}</span></div>
      </div>
      <div class="row" id="actions"></div>
      ${body}
      <p class="muted" style="margin-top:12px">Nguồn: <a href="https://lrclib.net" target="_blank" rel="noopener">LRCLIB</a> · Lời bài hát thuộc bản quyền tác giả. Dùng cho mục đích cá nhân / học tập.</p>
    </div>`;

  document.getElementById('btn-back').addEventListener('click', ()=>doSearch());

  // Render lyrics với event delegation
  const lyricsBox = document.getElementById('lyrics-box');
  if(showTS && synced){
    parseLRC(synced).forEach(r=>{
      const div = document.createElement('div');
      div.className = 'stanza';
      div.innerHTML = `<span class="ts">${fmtLRC(r.time)}</span>${esc(r.text)||'♪'}`;
      div.addEventListener('click', ()=>copyText(r.text, div));
      lyricsBox.appendChild(div);
    });
  } else if(plain){
    plain.split(/\n\s*\n/).filter(s=>s.trim()).forEach(s=>{
      const div = document.createElement('div');
      div.className = 'stanza';
      div.textContent = s;
      div.addEventListener('click', ()=>copyText(s, div));
      lyricsBox.appendChild(div);
    });
  }

  // Render action buttons
  const actions = document.getElementById('actions');
  if(text){
    const btnCopy = document.createElement('button');
    btnCopy.textContent = `📋 Copy ${showTS&&synced?'LRC':'toàn bộ'}`;
    btnCopy.addEventListener('click', ()=>copyText(text, btnCopy));
    actions.appendChild(btnCopy);
  }
  if(synced){
    const btnToggle = document.createElement('button');
    btnToggle.className = 'ghost';
    btnToggle.textContent = showTS?'Ẩn timestamp':'Hiện timestamp';
    btnToggle.addEventListener('click', ()=>{ showTS=!showTS; render(); });
    actions.appendChild(btnToggle);

    const btnLRC = document.createElement('button');
    btnLRC.className = 'ghost';
    btnLRC.textContent = '⬇ .lrc';
    btnLRC.addEventListener('click', ()=>downloadFile(slug+'.lrc', synced));
    actions.appendChild(btnLRC);

    const btnSRT = document.createElement('button');
    btnSRT.className = 'ghost';
    btnSRT.textContent = '⬇ .srt';
    btnSRT.addEventListener('click', ()=>downloadFile(slug+'.srt', toSRT(parseLRC(synced))));
    actions.appendChild(btnSRT);
  }
  if(plain){
    const btnTXT = document.createElement('button');
    btnTXT.className = 'ghost';
    btnTXT.textContent = '⬇ .txt';
    btnTXT.addEventListener('click', ()=>downloadFile(slug+'.txt', plain));
    actions.appendChild(btnTXT);
  }
}

/* ---------- paste fallback ---------- */
function pasteBox(){
  out.innerHTML = `<div class="panel">
    <p class="muted" style="margin-bottom:10px">Dán lời vào đây. Mỗi khổ cách nhau 1 dòng trống. Nội dung lưu trên máy bạn.</p>
    <textarea id="ta" placeholder="Dán lời bài hát…"></textarea>
    <div class="row" style="margin-top:12px">
      <button id="btn-view">Xem &amp; Copy</button>
    </div></div>`;
  document.getElementById('btn-view').addEventListener('click', ()=>{
    const v = document.getElementById('ta').value.trim();
    if(!v) return;
    cur = {trackName:'Lời của bạn', artistName:'', plainLyrics:v, syncedLyrics:''};
    showTS = false;
    render();
  });
}

/* ---------- discover ---------- */
const seeds = ['yêu','mưa','love','night','nhớ','dream','buồn','home'];
document.getElementById('chips').innerHTML = seeds.map(s=>`<span class="chip">${s}</span>`).join('');
document.querySelectorAll('.chip').forEach((chip,i)=>{
  chip.addEventListener('click', ()=>doSearch(seeds[i]));
});

(async()=>{
  try{
    const r = await fetch(`${API}/search?q=${encodeURIComponent(seeds[Math.floor(Math.random()*seeds.length)])}`);
    const list = (await r.json()).filter(t=>t.syncedLyrics).slice(0,8);
    if(!list.length){ out.innerHTML='<p class="muted">Nhập tên bài để bắt đầu.</p>'; return; }
    out.innerHTML = `<p class="muted" style="margin-bottom:10px">🎧 Có sẵn LRC — thử bấm một bài</p><div id="disc"></div>`;
    const disc = document.getElementById('disc');
    list.forEach(t=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<b>${esc(t.trackName)}<span class="badge lrc">LRC</span></b><span>${esc(t.artistName)}</span>`;
      card.addEventListener('click', ()=>openTrack(t.id));
      disc.appendChild(card);
    });
  }catch{ out.innerHTML='<p class="muted">Nhập tên bài để bắt đầu.</p>'; }
})();
</script>
</body>
</html>
